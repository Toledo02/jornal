weather:
  city: "Curitiba"
  lat: -25.4284
  lon: -49.2733
  # A partir de qual chance por hora vale avisar "vai chover entre X e Y".
  rain_threshold_percent: 40

finance:
  scrape_targets:
    - name: "InfoMoney Mercados"
      url: "https://www.infomoney.com.br/mercados/"
      use_playwright: false
      selectors:
        headlines: "h2 a, h3 a"
        max_items: 5

investments:
  enabled: true
  # Séries do SGS do Banco Central (api.bcb.gov.br) — públicas, sem chave e sem cota.
  # `unit` diz como o valor chega: "a.a." anual, "a.m." mensal, "12m" acumulado em doze meses.
  # Juro real e a anualização da poupança são calculados em Python (investments.py).
  series:
    selic:
      code: 432
      label: "Selic (meta)"
      unit: "a.a."
    cdi:
      code: 4389
      label: "CDI"
      unit: "a.a."
    ipca_12m:
      code: 13522
      label: "IPCA (12 meses)"
      unit: "12m"
    poupanca:
      code: 195
      label: "Poupança"
      unit: "a.m."
  profiles: ["conservador", "moderado", "arrojado"]
  disclaimer: "Conteúdo informativo, não é recomendação de investimento."

rss_feeds:
  tech:
    - "https://techcrunch.com/feed/"
    - "https://www.theverge.com/rss/index.xml"
    - "https://www.tabnews.com.br/recentes/rss"
  world:
    - "https://g1.globo.com/rss/g1/mundo/"
    - "https://feeds.bbci.co.uk/news/world/rss.xml"
    - "https://admin.cnnbrasil.com.br/feed/"
  pop_culture:
    # Omelete e JovemNerd derrubaram o RSS público (404 desde 04/07/2026).
    - "https://br.ign.com/feed.xml"
    - "https://www.legiaodosherois.com.br/feed"
    - "https://www.polygon.com/rss/index.xml"

rss:
  entries_per_feed: 6
  max_items_per_category: 15
  # Descarta entradas mais velhas que isso. Entradas sem data no feed são mantidas.
  max_age_hours: 30

github:
  trending_url: "https://github.com/trending"
  max_repos: 5

gaming:
  # Jogos realmente gratuitos (Epic, Steam, GOG, itch.io...). É o que a seção promete.
  gamerpower:
    enabled: true
    type: "game"          # "game" | "loot" | "beta"
    max_items: 5
    platforms: ["pc", "steam", "epic", "gog", "drm-free", "itch"]
    # Piso de valor: giveaway de US$ 0,99 ocupa a mesma linha de um de US$ 25 e não vale o
    # clique. Quem está no último dia entra mesmo abaixo do piso.
    min_worth_usd: 5
  cheapshark:
    enabled: true
    max_deals: 4
    # Filtros de relevância, na ordem de eficácia observada. `Deal Rating` é a nota própria do
    # CheapShark (desconto ponderado por qualidade); `sortBy: Savings` ordenava só pelo desconto
    # e o topo dessa lista é estático — eram sempre os mesmos jogos obscuros.
    sort_by: "Deal Rating"
    # Só jogos com preço cheio a partir de US$ 29. É o corte mais eficaz contra shovelware,
    # que nunca lançou nessa faixa.
    aaa_only: true
    # Nota mínima na Steam (%) e volume mínimo de avaliações: 95% de aprovação com 40 votos é
    # ruído, e é assim que jogo obscuro passa por um filtro que olha só a nota.
    min_steam_rating: 75
    min_steam_reviews: 1000
    # 0 no Metacritic significa "sem nota", não "nota ruim" — o filtro ignora esse caso.
    min_metacritic: 70
    min_savings_percent: 60
    # Candidatos coletados além do que será exibido, para o corte anti-repetição
    # (history.apply_repeat_policy) ter de onde tirar substituto.
    candidate_pool: 16

football:
  # Códigos de competição da football-data.org usados para descobrir o id dos times.
  # BSA = Brasileirão Série A. O id resolvido fica em logs/football_teams.json.
  competitions: ["BSA", "CL", "WC"]
  teams:
    # ids fixos: a resolução automática por nome não acha o Athletico, porque a API o
    # registra como "CA Paranaense". Confirmados na API em 28/07/2026.
    - name: "Athletico Paranaense"
      api_id: 1768
      ge_slug: "pr/futebol/times/athletico-pr"
    - name: "Seleção Brasileira"
      api_id: 764
      ge_slug: "futebol/selecao-brasileira"
  sources:
    ge:
      base_url: "https://ge.globo.com"
      selectors:
        # Manchetes recentes. NÃO usar seletor amplo como "div, section": ele casa com a
        # página inteira e injeta o body todo no payload do LLM.
        headlines: ".feed-post-link, .bastian-feed-item .feed-post-body-title"
        max_headlines: 4
      # Só passam manchetes sobre elenco e jogo. Sem isso a seção repetia as mesmas
      # matérias evergreen por dias seguidos.
      relevance_keywords:
        - "contrat"
        - "reforço"
        - "negocia"
        - "acerta"
        - "assina"
        - "renova"
        - "empréstimo"
        - "transferência"
        - "vendido"
        - "lesão"
        - "lesionado"
        - "desfalque"
        - "suspenso"
        - "cirurgia"
        - "escalação"
        - "convoca"
        - "poupado"
        - "retorna"
        - "estreia"
        - "gol"
        - "vitória"
        - "derrota"
        - "empate"
      # Chamadas de engajamento que o GE mistura ao feed e não são notícia.
      noise_patterns:
        - "siga o canal"
        - "vídeos curtos"
        - "whatsapp"
        - "assista ao vivo"
        - "veja a tabela"
        - "newsletter"
        - "tudo sobre"
        - "na globo, sportv"

promotions:
  # Fonte principal: canais públicos de promoção. Lidos via https://t.me/s/<canal>, a prévia
  # web que o Telegram publica — sem bot, sem token, sem entrar no canal.
  telegram_channels:
    - "promobit"
    - "promocoesdodia"
    - "hardmob_promo"
  max_age_hours: 24
  per_channel: 5
  max_items: 10
  # Teto por campanha: o mesmo cupom em cinco produtos tomava a seção inteira (num jornal real,
  # 3 dos 4 achados eram o mesmo "OFERTA8DO8" do Mercado Livre).
  max_per_coupon: 2
  noise_patterns:
    - "sorteio"
    - "participe do grupo"
    - "entre no nosso"
    - "clique aqui para receber"
    - "grupo de whatsapp"

  # Opcional: acompanha o preço de produtos específicos entre execuções (via Buscapé).
  # Use marca e modelo — a busca pega o primeiro resultado, então termo vago monitora
  # o produto errado. Ex.: "SSD Kingston NV2 1TB M.2 NVMe".
  product_names: []
  drop_threshold_percent: 5
  history_file: "promotions_history.json"

history:
  file: "history.json"
  # Janela do histórico. Dias mais antigos são descartados a cada gravação, então o arquivo
  # se mantém no mesmo tamanho em vez de crescer para sempre.
  retention_days: 30
  # Quantos jornais anteriores vão no prompt para a regra anti-repetição. Cada um custa
  # ~1.500 tokens, então subir muito encarece sem ganho proporcional.
  journals_in_prompt: 3
  # Por quantos dias um jogo ou oferta já publicado continua bloqueado. A regra do prompt não
  # dá conta disso sozinha: o modelo não compara listas entre dias, só texto.
  repeat_window_days: 7

orchestrator:
  scraper_timeout_seconds: 30
  continue_on_scraper_failure: true
  # Com 10 fontes, enviar um jornal de uma seção só não vale a chamada ao LLM.
  min_sections_for_send: 4
  request_timeout_seconds: 15

logging:
  level: "INFO"
  directory: "logs"
