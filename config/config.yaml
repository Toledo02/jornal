weather:
  city: "Curitiba"
  lat: -25.4284
  lon: -49.2733

finance:
  scrape_targets:
    - name: "InfoMoney Mercados"
      url: "https://www.infomoney.com.br/mercados/"
      use_playwright: false
      selectors:
        headlines: "h2 a, h3 a"
        max_items: 5

rss_feeds:
  tech:
    - "https://techcrunch.com/feed/"
    - "https://www.theverge.com/rss/index.xml"
    - "https://www.tabnews.com.br/recentes/rss"
  world:
    - "https://g1.globo.com/rss/g1/mundo/"
    - "https://feeds.bbci.co.uk/news/world/rss.xml"
    - "https://admin.cnnbrasil.com.br/feed/"
  pop_culture:
    # Omelete e JovemNerd derrubaram o RSS público (404 desde 04/07/2026).
    - "https://br.ign.com/feed.xml"
    - "https://www.legiaodosherois.com.br/feed"
    - "https://www.polygon.com/rss/index.xml"

rss:
  entries_per_feed: 6
  max_items_per_category: 15
  # Descarta entradas mais velhas que isso. Entradas sem data no feed são mantidas.
  max_age_hours: 30

github:
  trending_url: "https://github.com/trending"
  max_repos: 5

gaming:
  cheapshark:
    enabled: true
    max_deals: 7
    min_savings_percent: 90
    # Nota mínima na Steam (%). Sem isso, "ordenar por maior desconto" só traz shovelware.
    min_steam_rating: 70

football:
  teams:
    - "Athletico Paranaense"
    - "Brazil"
  sources:
    ge:
      base_url: "https://ge.globo.com"
      team_slugs:
        # URLs finais: o slug antigo passava por dois redirects 301 encadeados.
        Athletico Paranaense: "pr/futebol/times/athletico-pr"
        Brazil: "futebol/selecao-brasileira"
      selectors:
        next_match: ".agenda-jogos__item, .proximos-jogos, .jogo__informacoes"
        last_match: ".resultado-jogos__item, .ultimos-jogos, .placar"
        # Manchetes recentes. NÃO usar seletor amplo como "div, section": ele casa com a
        # página inteira e injeta o body todo no payload do LLM.
        headlines: ".feed-post-link, .bastian-feed-item .feed-post-body-title"
        max_headlines: 6
      # Chamadas de engajamento que o GE mistura ao feed e não são notícia.
      noise_patterns:
        - "siga o canal"
        - "vídeos curtos"
        - "whatsapp"
        - "assista ao vivo"
        - "veja a tabela"
        - "newsletter"
        - "tudo sobre"
        - "na globo, sportv"

promotions:
  drop_threshold_percent: 5
  history_file: "promotions_history.json"
  product_names: []

orchestrator:
  scraper_timeout_seconds: 30
  continue_on_scraper_failure: true
  # Com 9 fontes, enviar um jornal de uma seção só não vale a chamada ao LLM.
  min_sections_for_send: 4
  request_timeout_seconds: 15

logging:
  level: "INFO"
  directory: "logs"
